# Source of truth for the Xcode project. Phleet.xcodeproj is generated from this file
# by `make generate` and is never committed. Do not hand-edit a .pbxproj.
name: Phleet

options:
  bundleIdPrefix: com.anvarlab
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  configs:
    Debug:
      # Set explicitly rather than relied on from a preset: AC 8 asserts the build-gate
      # property is true in the test bundle, and @testable import needs testability on.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: "YES"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      ENABLE_TESTABILITY: "NO"

targets:

  Phleet:
    type: application
    platform: iOS
    sources:
      - path: Phleet
        excludes:
          - "Info.plist"
          - "Phleet.entitlements"
    # Both extensions are embedded in the app. XcodeGen adds the embed phase for an
    # app-extension dependency on its own.
    dependencies:
      - target: PhleetWidgets
      - target: PhleetShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anvarlab.phleet
        INFOPLIST_FILE: Phleet/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Phleet/Phleet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Each target is signed with its own profile. release.yml supplies the three names;
        # nothing else sets them, and `make test` signs ad hoc and passes an empty specifier
        # on the command line, which wins over this.
        PROVISIONING_PROFILE_SPECIFIER: $(PHLEET_APP_PROFILE)

  # The home-screen and lock-screen widget.
  #
  # An extension is its own program in its own process: it shares no code with the app unless
  # the same files are compiled into it. The list below is everything the widget needs to sign
  # in and read the fleet — the screenless sign-in the shortcuts use, the orchestrator client,
  # and the types those name — and nothing of the app's screens. A file added to that chain has
  # to be added here and under PhleetShare; the build says so when one is missing.
  PhleetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PhleetWidgets
        excludes:
          - "Info.plist"
          - "PhleetWidgets.entitlements"
      - path: Phleet/Glance/GlanceContent.swift
      - path: Phleet/Shortcuts/QuickActions.swift
      - path: Phleet/Credentials/CredentialStore.swift
      - path: Phleet/Credentials/DeviceCredential.swift
      - path: Phleet/Credentials/KeychainCredentialStore.swift
      - path: Phleet/Credentials/SharedCredentialStore.swift
      - path: Phleet/Control/ControlAPIClient.swift
      - path: Phleet/Control/ControlConnection.swift
      - path: Phleet/Control/ControlModels.swift
      - path: Phleet/Control/ControlPresentation.swift
      - path: Phleet/Control/PendingGate.swift
      - path: Phleet/Control/URLSessionControlAPIClient.swift
      - path: Phleet/Chat/ChatAgent.swift
      - path: Phleet/Networking/FleetAPIClient.swift
      - path: Phleet/Networking/URLSessionFleetAPIClient.swift
      - path: Phleet/Networking/RetryAfterParser.swift
      - path: Phleet/Protocol
      - path: Phleet/Conversation/ImagePreparation.swift
      # The app's own catalog: the shared code looks its words up in the bundle it runs in.
      - path: Phleet/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anvarlab.phleet.widgets
        INFOPLIST_FILE: PhleetWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: PhleetWidgets/PhleetWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(PHLEET_WIDGETS_PROFILE)
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # The share sheet: text, a web address or images from another app, sent to an agent.
  # The same shared files as the widget, plus the sheet's own model.
  PhleetShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PhleetShare
        excludes:
          - "Info.plist"
          - "PhleetShare.entitlements"
      - path: Phleet/Sharing/ShareModel.swift
      - path: Phleet/Support/AccessibilityIdentifier.swift
      - path: Phleet/Shortcuts/QuickActions.swift
      - path: Phleet/Credentials/CredentialStore.swift
      - path: Phleet/Credentials/DeviceCredential.swift
      - path: Phleet/Credentials/KeychainCredentialStore.swift
      - path: Phleet/Credentials/SharedCredentialStore.swift
      - path: Phleet/Control/ControlAPIClient.swift
      - path: Phleet/Control/ControlConnection.swift
      - path: Phleet/Control/ControlModels.swift
      - path: Phleet/Control/ControlPresentation.swift
      - path: Phleet/Control/PendingGate.swift
      - path: Phleet/Control/URLSessionControlAPIClient.swift
      - path: Phleet/Chat/ChatAgent.swift
      - path: Phleet/Networking/FleetAPIClient.swift
      - path: Phleet/Networking/URLSessionFleetAPIClient.swift
      - path: Phleet/Networking/RetryAfterParser.swift
      - path: Phleet/Protocol
      - path: Phleet/Conversation/ImagePreparation.swift
      - path: Phleet/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anvarlab.phleet.share
        INFOPLIST_FILE: PhleetShare/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: PhleetShare/PhleetShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(PHLEET_SHARE_PROFILE)
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # App-hosted on purpose. A non-hosted logic bundle resolves Bundle.main to the test
  # bundle, the a11y.* catalog is not there, and AccessibilityStringTests would pass
  # vacuously. TEST_HOST is what makes .main the app bundle.
  PhleetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhleetTests
      # A folder reference, so a fixture added to the directory is picked up without touching
      # this file. Tests read it from the bundle's `protocol` subdirectory.
      - path: tests/fixtures/protocol
        type: folder
        buildPhase: resources
      # The orchestrator responses the control-plane tests decode. Read from the bundle's
      # `control` subdirectory.
      - path: tests/fixtures/control
        type: folder
        buildPhase: resources
    dependencies:
      - target: Phleet
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Phleet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Phleet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

  PhleetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhleetUITests
      # Shared so a renamed identifier breaks the UI test at compile time instead of
      # leaving it querying a string that no longer exists. `LaunchArguments` is shared for
      # the same reason: a renamed argument must not leave a test launching an app that
      # quietly ignores it.
      - path: Phleet/Support/AccessibilityIdentifier.swift
      - path: Phleet/Support/LaunchArguments.swift
    dependencies:
      - target: Phleet
    settings:
      base:
        TEST_TARGET_NAME: Phleet
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

schemes:
  Phleet:
    build:
      targets:
        Phleet: all
        PhleetTests: [test]
        PhleetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PhleetTests
        - PhleetUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
