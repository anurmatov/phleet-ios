# Source of truth for the Xcode project. Phleet.xcodeproj is generated from this file
# by `make generate` and is never committed. Do not hand-edit a .pbxproj.
name: Phleet

options:
  bundleIdPrefix: com.anvarlab
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  configs:
    Debug:
      # Set explicitly rather than relied on from a preset: AC 8 asserts the build-gate
      # property is true in the test bundle, and @testable import needs testability on.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: "YES"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      ENABLE_TESTABILITY: "NO"

targets:

  Phleet:
    type: application
    platform: iOS
    sources:
      - path: Phleet
        excludes:
          - "Info.plist"
          - "Phleet.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anvarlab.phleet
        INFOPLIST_FILE: Phleet/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Phleet/Phleet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # App-hosted on purpose. A non-hosted logic bundle resolves Bundle.main to the test
  # bundle, the a11y.* catalog is not there, and AccessibilityStringTests would pass
  # vacuously. TEST_HOST is what makes .main the app bundle.
  PhleetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhleetTests
    dependencies:
      - target: Phleet
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Phleet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Phleet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

  PhleetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhleetUITests
      # Shared so a renamed identifier breaks the UI test at compile time instead of
      # leaving it querying a string that no longer exists.
      - path: Phleet/Support/AccessibilityIdentifier.swift
    dependencies:
      - target: Phleet
    settings:
      base:
        TEST_TARGET_NAME: Phleet
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

schemes:
  Phleet:
    build:
      targets:
        Phleet: all
        PhleetTests: [test]
        PhleetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PhleetTests
        - PhleetUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
